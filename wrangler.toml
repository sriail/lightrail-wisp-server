name = "lightrail-wisp-server"
main = "src/worker.py"

compatibility_date = "2026-10-01"
compatibility_flags = ["python_workers"]

[python_modules]
exclude = ["**/*.pyc", "**/__pycache__"]

[env.production.vars]
ENVIRONMENT = "production"
PYTHONUNBUFFERED = "1"

[env.development.vars]
ENVIRONMENT = "development"
PYTHONUNBUFFERED = "1"

[observability]
enabled = true
