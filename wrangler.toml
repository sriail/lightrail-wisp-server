name = "lightrail-wisp-server"
type = "python"
main = "src/worker.py"
compatibility_date = "2024-12-16"
compatibility_flags = ["python_workers"]

vars = { 
 # Add a tunnel for UDP Support
 # TUNNEL_URL = "https://PRODUCTION-TUNNEL-URL",
  LOG_LEVEL = "info"
}

[env.production]
routes = [{ pattern = "wisp.example.com/wisp/*", zone_name = "example.com" }]
# vars = { TUNNEL_URL = "https://PRODUCTION-TUNNEL-URL" }

