name = "lightrail-wisp-server"
main = "./src/worker.py"
type = "python"
compatibility_date = "2026-07-01"
compatibility_flags = ["python_workers"]
[python_modules]
exclude = ["**/*.pyc", "**/__pycache__"]

# Enable TCP sockets
[env.production.vars]
ENVIRONMENT = "production"

[env.production]
vars = { ENVIRONMENT = "production", PYTHONUNBUFFERED = "1" }
routes = [
  { pattern = "/wisp/*", zone_name = "your-domain.com" }
]

# Python-specific settings
[build]
command = "pip install -r requirements.txt"

# Limits and performance
vars = { PYTHONUNBUFFERED = "1" }

# Observability
[observability]
enabled = true

python_external_sdk = true

# Durable Objects (if needed for connection pooling)
# [[durable_objects.bindings]]
# name = "CONNECTION_POOL"
# class_name = "ConnectionPool"
