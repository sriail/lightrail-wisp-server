[package]
name = "lightrail-wisp-server"
version = "1.2.0"
edition = "2021"
description = "Wisp v1.2 HTTP-profile server for Cloudflare Workers (TCP-only, queued, HTTP lane, GET heads) Developed By Sriail"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "=0.9.0" }
serde_json = "1"
futures = "0.3"
wasm-bindgen-futures = "0.4"
tokio = { version = "1", default-features = false, features = ["io-util"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
