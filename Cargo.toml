[package]
name = "wisp-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.4.0"
futures = "0.3"
wasm-bindgen-futures = "=0.4.55"
web-sys = "=0.3.82"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "rt"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
