[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightrail-wisp-server"
version = "0.1.0"
description = "Wisp protocol server for Cloudflare Workers Based on the Python Wisp Implamentation"
requires-python = ">=3.11"
dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "uvloop>=0.19.0",
]
