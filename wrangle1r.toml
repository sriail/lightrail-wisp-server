
name = "lightrail-wisp-server"
type = "python"
main = "src/worker.py"
compatibility_date = "2024-12-16"
compatibility_flags = ["python_workers"]

vars = {
  LOG_LEVEL = "info",
  RATE_LIMIT_ENABLED = "true",
  RATE_LIMIT_BANDWIDTH = "1000",
  RATE_LIMIT_CONNECTIONS = "30",
  RATE_LIMIT_WINDOW = "60",
  ALLOW_LOOPBACK = "false",
  ALLOW_PRIVATE = "false",
  BLOCK_UDP = "false",
  BLOCK_TCP = "false"
}

# Production environment
[env.production]
name = "lightrail-wisp-prod"
vars = {
  LOG_LEVEL = "info",
  RATE_LIMIT_ENABLED = "true",
  RATE_LIMIT_BANDWIDTH = "5000",
  RATE_LIMIT_CONNECTIONS = "100",
  RATE_LIMIT_WINDOW = "60"
}

# Configure route for production
[[env.production.routes]]
pattern = "wisp.example.com/*"
zone_name = "example.com"

# Health check every 6 hours
[env.production.triggers.crons]
crons = ["0 */6 * * *"]

# Staging environment
[env.staging]
name = "lightrail-wisp-staging"
vars = {
  LOG_LEVEL = "debug",
  RATE_LIMIT_ENABLED = "true",
  RATE_LIMIT_BANDWIDTH = "2000",
  RATE_LIMIT_CONNECTIONS = "50",
  RATE_LIMIT_WINDOW = "60"
}

[[env.staging.routes]]
pattern = "wisp-staging.example.com/*"
zone_name = "example.com"

[env.staging.triggers.crons]
crons = ["0 */4 * * *"]

[build]
command = "pip install -r requirements.txt"
cwd = "./"

[[build.upload_rules]]
type = "CompiledContentType"
fallthrough = true

# CPU limit (note, this is already in effect, for you to enable if running on your owen system)
# limits = {
